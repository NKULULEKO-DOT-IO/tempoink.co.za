<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- TEMPOINK Logo -->
  <defs>
    <style>
      .logo-text { 
        font-family: 'Arial Black', Arial, sans-serif; 
        font-weight: 900; 
        font-size: 20px; 
        fill: #000; 
        letter-spacing: 1px;
      }
      .logo-tm { 
        font-family: Arial, sans-serif; 
        font-weight: 400; 
        font-size: 10px; 
        fill: #000; 
      }
      .logo-underline {
        stroke: #000;
        stroke-width: 2;
      }
    </style>
  </defs>
  
  <!-- Main Text -->
  <text x="10" y="35" class="logo-text">TEMPOINK</text>
  
  <!-- Trademark Symbol -->
  <text x="175" y="20" class="logo-tm">™</text>
  
  <!-- Underline -->
  <line x1="10" y1="45" x2="180" y2="45" class="logo-underline" />
</svg>